name: Deploy Jayasree portfolio to Vercel

on:
  push:
    branches: [master, cursor/jayasree-portfolio-4082]
    paths:
      - 'jayasree-portfolio/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy portfolio
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured."
            exit 1
          fi
          chmod +x ./jayasree-portfolio/deploy.sh
          ./jayasree-portfolio/deploy.sh production
