services:
  - type: web
    name: delivery-platform-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: delivery-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: USE_MOCK_INTEGRATIONS
        value: "true"

databases:
  - name: delivery-platform-db
    plan: free
    databaseName: delivery_platform
    user: delivery
