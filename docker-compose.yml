services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery-platform-db
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery123
      POSTGRES_DB: delivery_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
