<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM360 – Delivery Intelligence Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css?v=20260708" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">T360</div>
        <div class="brand-text">
          <span class="brand-name">TEAM360</span>
          <span class="brand-tagline">Delivery Intelligence</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-meta">
          <span class="meta-label">Last sync</span>
          <span class="meta-value">2 min ago</span>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="search-bar">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="global-search" placeholder="Search employees, projects, tasks..." />
          <kbd class="search-kbd">⌘K</kbd>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" aria-label="Notifications" id="notifications-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="notification-badge">5</span>
          </button>
          <div class="profile-menu">
            <button class="profile-btn" id="profile-btn">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=SarahChen" alt="Profile" class="avatar" />
              <div class="profile-info">
                <span class="profile-name">Sarah Chen</span>
                <span class="profile-role">Delivery Director</span>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
        </div>
      </header>

      <main class="content" id="app-content"></main>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <button class="projects-fab" id="add-project-fab" type="button" aria-label="Add project">+</button>

  <script type="module" src="assets/js/data.js?v=20260708"></script>
  <script type="module" src="assets/js/components.js?v=20260708"></script>
  <script type="module" src="assets/js/pages.js?v=20260708"></script>
  <script type="module" src="assets/js/app.js?v=20260708"></script>
</body>
</html>
